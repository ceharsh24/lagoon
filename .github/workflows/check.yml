name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrast:
    name: contrast audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the build if any accent drops below its WCAG floor, or if two
      # accents land close enough to be mistaken for each other.
      - name: Audit palette contrast
        run: npm run check

      # The themes and the site are build output. If regenerating them changes
      # anything, the committed files are stale.
      #
      # The PNGs are deliberately not diffed: zlib's compressed output is not
      # guaranteed byte-identical across platforms and versions, so comparing
      # them would fail on the runner even when the pixels match.
      - name: Verify generated files are current
        run: |
          npm run build
          git diff --exit-code -- themes docs/index.html \
            || { echo "::error::themes/ or docs/index.html is out of date — run npm run build"; exit 1; }
